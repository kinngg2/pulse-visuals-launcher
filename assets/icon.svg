<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MonoClient">
  <defs>
    <linearGradient id="mcMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7770ff"/>
      <stop offset="55%" stop-color="#9b54ff"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>
    <linearGradient id="mcShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="mcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- rounded square base -->
  <rect x="16" y="16" width="224" height="224" rx="54" ry="54" fill="url(#mcMain)"/>
  <!-- top shine -->
  <rect x="16" y="16" width="224" height="224" rx="54" ry="54" fill="url(#mcShine)"/>
  <!-- inner stroke -->
  <rect x="20" y="20" width="216" height="216" rx="50" ry="50" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- stylized M monogram: two pillars joined by a V -->
  <g transform="translate(64 64)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- left vertical -->
    <line x1="6" y1="128" x2="6" y2="6"/>
    <!-- right vertical -->
    <line x1="122" y1="128" x2="122" y2="6"/>
    <!-- center V -->
    <polyline points="6,6 64,86 122,6"/>
  </g>

  <!-- subtle accent dot -->
  <circle cx="128" cy="206" r="6" fill="#ffffff" fill-opacity="0.9"/>
</svg>
